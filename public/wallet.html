<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wallet</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme-utils.js?v=20260726c"></script>
</head>
<body class="bg-overlay wallet-page">
  <header class="site-header">
    <div class="header-left">
      <img src="HUSHLOGO.png" alt="Logo" class="logo">
    </div>
    <div class="header-right">
      <a href="dashboard.html" class="account-btn">Back</a>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <section class="box">
        <h2>Your Wallet</h2>
        <p>Current balance: <strong id="walletAmount">$0</strong></p>
        <div class="wallet-action-row">
          <input id="addAmount" class="wallet-amount-input" type="number" min="1" placeholder="Amount" />
          <button id="addBtn" class="btn">Add Funds</button>
          <button id="clearBtn" class="btn btn-secondary">Withdrawal</button>
        </div>

        <hr class="wallet-separator" />
        <h3>Pay with Card</h3>
        <form id="cardForm" class="wallet-card-form">
          <input id="cardName" class="wallet-card-input" type="text" placeholder="Name on card" required />
          <input id="cardNumber" class="wallet-card-input" type="text" placeholder="Card number (xxxx xxxx xxxx xxxx)" maxlength="19" required />
          <div class="wallet-card-row">
            <input id="cardExpiry" class="wallet-card-input wallet-card-expiry" type="text" placeholder="MM/YY" maxlength="5" required />
            <input id="cardCVC" class="wallet-card-input wallet-card-cvc" type="text" placeholder="CVC" maxlength="4" required />
          </div>
          <button id="cardPayBtn" type="submit" class="btn">Pay with Card</button>
        </form>

        <hr class="wallet-separator" />
        <h3>PayPal</h3>
        <p>
          <a id="paypalBtn" class="wallet-paypal-link" href="https://www.paypal.com/signin" target="_blank" rel="noopener noreferrer" aria-label="Open PayPal">
            <img class="wallet-paypal-image" src="https://www.citypng.com/public/uploads/preview/download-paypal-yellow-payment-button-png-21635275375jabzun4vce.png" alt="PayPal button" />
          </a>
        </p>
        <p class="wallet-note">This is a demo wallet stored in localStorage.</p>
      </section>
    </div>
  </main>

  <script src="preferences.js"></script>
  <script src="wallet.js"></script>
</body>
</html>

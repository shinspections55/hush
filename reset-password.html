<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme-utils.js?v=20260726c"></script>
</head>
<body class="bg-overlay">
  <header class="site-header">
    <img src="HUSHLOGO.png" alt="Logo" class="logo">
  </header>

  <main class="page">
    <div class="container">
      <section class="box">
        <h2>Password Reset</h2>
        <p class="form-helper">Use the reset link from your email to choose a new password. If you opened this page without the email link, you can also reset manually with your email/username and verification code.</p>

        <form id="resetPasswordForm">
          <div id="manualResetFields">
            <input type="text" id="resetIdentifier" name="identifier" placeholder="Email address or username" autocomplete="username">
            <input type="text" id="resetCode" name="code" placeholder="Verification code">
          </div>
          <input type="password" id="resetNewPassword" name="newPassword" placeholder="New password" autocomplete="new-password" required>
          <input type="password" id="resetConfirmPassword" name="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" required>
          <button type="submit" class="btn btn-login">Reset password</button>
        </form>

        <div class="account-link-list">
          <a class="form-link" href="forgot-password.html">Send another reset email</a>
          <a class="form-link" href="index.html">Back to login</a>
        </div>

        <p id="resetStatus" class="form-status"></p>
      </section>
    </div>
  </main>
  <script src="preferences.js"></script>
  <script type="module" src="reset-password.js"></script>
</body>
</html>

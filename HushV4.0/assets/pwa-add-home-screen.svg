<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Add to Home Screen Option</title>
  <desc id="desc">A simplified iPhone share sheet highlighting Add to Home Screen.</desc>
  <defs>
    <linearGradient id="sheetBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a3d42" />
      <stop offset="1" stop-color="#2f3136" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="560" fill="#0f1218" />
  <rect x="60" y="20" width="800" height="520" rx="38" ry="38" fill="url(#sheetBg)" stroke="#5d6168" stroke-width="2" />

  <rect x="90" y="300" width="740" height="160" rx="22" fill="#4b4d52" />
  <line x1="120" y1="350" x2="800" y2="350" stroke="#686b70" stroke-width="2" />
  <line x1="120" y1="405" x2="800" y2="405" stroke="#686b70" stroke-width="2" />

  <g fill="#e7ebf4" font-family="Arial, sans-serif">
    <text x="165" y="337" font-size="28">Find on Page</text>
    <text x="165" y="392" font-size="28">Add to Home Screen</text>
    <text x="165" y="447" font-size="28">Markup</text>
  </g>

  <g fill="none" stroke="#e7ebf4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="95" y="366" width="34" height="34" rx="9" />
    <path d="M112 389 L112 374" />
    <path d="M104 381 L112 373 L120 381" />
    <line x1="102" y1="393" x2="122" y2="393" />
  </g>

  <rect x="86" y="356" width="748" height="62" rx="12" fill="none" stroke="#ffd54f" stroke-width="9" />

  <text x="460" y="510" fill="#ffd54f" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="700">
    Then tap Add to Home Screen
  </text>
</svg>

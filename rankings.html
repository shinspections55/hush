<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F2F44">
  <meta name="description" content="Hush - Silent draft fantasy football league management">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png">
  <link rel="apple-touch-icon" href="/icon-192x192.png">
  <title>My Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="rankings.css?v=20261104-row-stars">
  <link rel="stylesheet" href="ad-placements.css">
  <script src="ad-placements.js" defer></script>
  <script src="theme-utils.js?v=20260821-c9c656a0"></script>
</head>
<body class="bg-overlay">

  <header class="site-header">
    <div class="rankings-header-banner" aria-hidden="true">
      <img src="printablehushrank.PNG" alt="" class="rankings-header-banner-image rankings-header-banner-image-dark">
      <img src="printablehushrank.PNG" alt="" class="rankings-header-banner-image rankings-header-banner-image-light">
    </div>
    <div class="header-right">
      <span id="draftStatusBadge" class="draft-status-badge hidden"></span>
      <button id="themeToggleBtn" class="account-btn theme-toggle-btn theme-icon-btn" type="button" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="false">🌙</button>
    </div>
  </header>

  <nav class="rankings-mobile-tabs" aria-label="Rankings workspace">
    <button type="button" data-mobile-view="rankings" aria-pressed="true" aria-controls="rankingsPanel">My Rankings</button>
    <button type="button" data-mobile-view="pool" aria-pressed="false" aria-controls="playerPoolPanel">Player Pool</button>
  </nav>
  <div class="rankings-page" data-mobile-view="rankings">

    <!-- ------------------------------------------------------------------ -->
    <!-- LEFT PANEL: My Rankings                                          -->
    <!-- ------------------------------------------------------------------ -->
    <div class="rankings-panel" id="rankingsPanel">

      <div class="rankings-panel-header">
        <div class="rankings-panel-title">
          <h2>My Rankings</h2>
          <span id="totalCount" class="total-count">0 players</span>
        </div>
        <div class="rankings-panel-actions">
          <label class="print-metric-control" for="printMetricSelect">
            <span>Print:</span>
            <select id="printMetricSelect" aria-label="Printable ranking metric">
              <option value="av">AV</option>
              <option value="adp">ADP</option>
            </select>
          </label>
          <label class="print-teams-control" for="printTeamCount">
            <span>Teams:</span>
            <input id="printTeamCount" type="number" min="2" max="32" step="1" value="12" aria-label="Number of teams for snake draft ADP">
          </label>
          <button id="tierInsertModeBtn" class="action-btn" type="button">Easy Tier Breaks: Off</button>
          <button id="printRankingsBtn" class="action-btn" type="button">Print</button>
          <button id="saveRankingsBtn" class="action-btn saved">Saved ✓</button>
        </div>
      </div>

      <div id="printMetaBar" class="print-meta-bar" aria-live="polite"></div>

      <div class="board-tabs" id="boardTabs">
        <button class="board-tab-btn active" data-board="personal">Personal Rankings</button>
        <button class="board-tab-btn" data-board="default">Default Rankings</button>
        <button class="board-tab-btn" data-board="database">Database Rankings</button>
      </div>

      <!-- Legend (shown only during active draft) -->
      <div id="draftLegend" class="draft-legend hidden">
        <span class="legend-item legend-current">Current Round</span>
        <span class="legend-item legend-yours">Your Roster</span>
        <span class="legend-item legend-drafted">Drafted</span>
        <span class="legend-item legend-passed">Passed</span>
      </div>

      <!-- Position filter bar -->
      <div class="pos-filter-bar">
        <button class="pos-filter-btn active" data-pos="ALL">ALL</button>
        <button class="pos-filter-btn" data-pos="QB">QB</button>
        <button class="pos-filter-btn" data-pos="RB">RB</button>
        <button class="pos-filter-btn" data-pos="WR">WR</button>
        <button class="pos-filter-btn" data-pos="TE">TE</button>
        <button class="pos-filter-btn" data-pos="K">K</button>
        <button class="pos-filter-btn" data-pos="DEF">DEF</button>
        <button id="clearFilteredRankingsBtn" class="action-btn danger clear-filter-btn" type="button">Clear Position</button>
      </div>

      <!-- Rankings list (tiers rendered here) -->
      <div class="rankings-list" id="rankingsList">
        <div class="rankings-empty" id="rankingsEmpty">
          <div class="empty-icon">ðŸ“‹</div>
          <p>Your rankings board is empty</p>
          <p class="empty-hint rankings-desktop-hint">Click players on the right to add them, or drag &amp; drop</p>
          <button type="button" class="rankings-open-pool" data-open-player-pool>Add players</button>
        </div>
      </div>

      <div id="printLayoutSheet" class="print-layout-sheet" aria-hidden="true"></div>

    </div>

    <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
    <!-- RIGHT PANEL: Player Pool                          -->
    <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
    <div class="pool-panel" id="playerPoolPanel">

      <div class="pool-panel-header">
        <h2>Player Pool</h2>
        <div class="pool-search-wrap">
          <input type="text" id="poolSearch" class="pool-search" placeholder="Search players…" autocomplete="off">
        </div>
      </div>

      <!-- Position tabs -->
      <div class="pos-tabs">
        <button class="pos-tab active" data-pos="QB">QB</button>
        <button class="pos-tab" data-pos="RB">RB</button>
        <button class="pos-tab" data-pos="WR">WR</button>
        <button class="pos-tab" data-pos="TE">TE</button>
        <button class="pos-tab" data-pos="K">K</button>
        <button class="pos-tab" data-pos="DEF">DEF</button>
      </div>

      <!-- Pool count line -->
      <div class="pool-meta" id="poolMeta">Loading…</div>

      <!-- Player list -->
      <div class="pool-list" id="poolList">
        <div class="pool-loading">Loading players…</div>
      </div>

    </div>

  </div>

  <dialog id="movePlayerDialog" class="rankings-move-dialog" aria-labelledby="movePlayerTitle">
    <form id="movePlayerForm">
      <h2 id="movePlayerTitle">Move player</h2>
      <label>Destination<select id="movePlayerMode"><option value="rank">Rank number</option><option value="tier">Top of tier</option></select></label>
      <label id="moveRankField">Rank<input id="movePlayerRank" type="number" min="1" step="1" inputmode="numeric" required></label>
      <label id="moveTierField" hidden>Tier<select id="movePlayerTier" disabled></select></label>
      <p id="movePlayerError" role="alert"></p>
      <div class="rankings-move-actions">
        <button id="movePlayerCancel" type="button">Cancel</button>
        <button type="submit">Move</button>
      </div>
    </form>
  </dialog>
  <p id="rankingsMobileStatus" class="rankings-mobile-status" role="status" aria-live="polite"></p>
  <aside class="hush-ad-placement" data-ad-placement="rankings-bottom" aria-label="Advertisement" hidden></aside>
  <script src="preferences.js"></script>
  <script src="rankings.js?v=20261104-row-stars"></script>
  <script src="sw-register.js?v=20260828-write-in-roster"></script>
</body>
</html>

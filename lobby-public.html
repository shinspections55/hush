<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Public Draft Lobby</title>
  <link rel="stylesheet" href="styles.css?v=20260625b">
  <script src="theme-utils.js?v=20260726c"></script>
  </head>
<body class="bg-overlay">
  <header class="site-header">
    <div class="header-left">
      <img src="HUSHLOGO.png" alt="Logo" class="logo">
    </div>
    <div class="header-right">
      <a href="dashboard.html" class="account-btn">Back</a>
    </div>
  </header>
  <main class="page">
    <div class="container">
      <section class="box" id="lobbyBox">
        <div id="hostBanner" class="host-banner hidden">
          Lobby is full.
          <button id="dismissBanner" class="dismiss-btn">âœ•</button>
        </div>
        <div class="lobby-top-row">
          <div class="lobby-top-left">
            <div class="lobby-heading-row">
              <h2 id="draftTitle" class="hush-silver">Public Draft Lobby</h2>
              <div id="memberCountBadge" class="member-count-badge hush-silver">Users in Lobby: 0</div>
            </div>
            <p id="draftCode" class="hush-silver">Code: </p>
            <div class="lobby-share-row">
              <button id="shareLobbyCodeBtn" class="type-btn" type="button">Share Lobby Code</button>
            </div>
          </div>
          <div class="lobby-member-counter hush-silver">Users: <span id="memberCount">0</span></div>
        </div>
        <style>
        .hush-silver { color: var(--hush-silver) !important; }
        </style>
        <div class="lobby-layout">
          <div class="lobby-members-column">
            <h3 class="hush-silver">Members</h3>
            <ul id="memberList" class="hush-silver"></ul>
          </div>
          <div class="lobby-options-column">
            <div class="lobby-controls">
              <div class="type-display">Type:</div>
              <div class="flex-container">
                <label class="radio-label">
                  <input type="radio" name="draftType" value="silent" checked>
                  <span>Silent auction</span>
                </label>
                <div class="draft-type-under-construction">
                  <div class="under-construction-badge">Under Construction</div>
                  <label class="radio-label radio-label-under-construction">
                    <span class="radio-x-wrap">
                      <input type="radio" name="draftType" value="rounds3" data-under-construction="true" disabled>
                      <span class="radio-red-x" aria-hidden="true">X</span>
                    </span>
                    <span>3 rounds auction</span>
                  </label>
                </div>
              </div>
            </div>
            <div id="draftOrderSection" class="lobby-controls draft-order-section">
              <div class="type-display">Draft Order:</div>
              <div class="flex-container">
                <label class="radio-label">
                  <input type="radio" name="draftOrder" value="manual" checked>
                  <span>Set draft order</span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="draftOrder" value="random">
                  <span>Random order</span>
                </label>
              </div>
            </div>
            <details class="lobby-custom-settings" id="lobbyCustomSettings">
              <summary class="lobby-custom-settings-summary">Custom Settings</summary>
              <div class="lobby-custom-settings-body">
                <div class="lobby-controls">
                  <div class="type-display">Capacity: <span id="draftCapacity">10</span></div>
                  <div id="capacityControls" class="capacity-controls">
                    <select id="capacitySelect" class="type-btn" aria-label="Select draft capacity">
                      <option value="10" selected>10</option>
                      <option value="12">12</option>
                      <option value="14">14</option>
                    </select>
                    <button id="applyCapacityBtn" type="button" class="type-btn">Apply</button>
                  </div>
                </div>
                <div class="lobby-controls roster-controls" id="rosterControls">
                  <div class="type-display">Roster Setup:</div>
                  <div class="roster-grid" id="rosterGrid">
                    <label class="roster-stepper" data-roster-key="QB"><span>QB</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterQBValue">1</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="QB" data-step-dir="1" aria-label="Increase QB">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="QB" data-step-dir="-1" aria-label="Decrease QB">&#9660;</button></div></div><input id="rosterQB" type="hidden" data-min="0" data-max="8" value="1"></label>
                    <label class="roster-stepper" data-roster-key="WR"><span>WR</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterWRValue">2</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="WR" data-step-dir="1" aria-label="Increase WR">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="WR" data-step-dir="-1" aria-label="Decrease WR">&#9660;</button></div></div><input id="rosterWR" type="hidden" data-min="0" data-max="10" value="2"></label>
                    <label class="roster-stepper" data-roster-key="RB"><span>RB</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterRBValue">2</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="RB" data-step-dir="1" aria-label="Increase RB">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="RB" data-step-dir="-1" aria-label="Decrease RB">&#9660;</button></div></div><input id="rosterRB" type="hidden" data-min="0" data-max="10" value="2"></label>
                    <label class="roster-stepper" data-roster-key="TE"><span>TE</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterTEValue">1</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="TE" data-step-dir="1" aria-label="Increase TE">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="TE" data-step-dir="-1" aria-label="Decrease TE">&#9660;</button></div></div><input id="rosterTE" type="hidden" data-min="0" data-max="8" value="1"></label>
                    <label class="roster-stepper" data-roster-key="FLEX"><span>FLEX</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterFLEXValue">1</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="FLEX" data-step-dir="1" aria-label="Increase FLEX">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="FLEX" data-step-dir="-1" aria-label="Decrease FLEX">&#9660;</button></div></div><input id="rosterFLEX" type="hidden" data-min="0" data-max="5" value="1"></label>
                    <label class="roster-stepper" data-roster-key="SPFLEX"><span>SPFLEX</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterSPFLEXValue">0</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="SPFLEX" data-step-dir="1" aria-label="Increase SPFLEX">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="SPFLEX" data-step-dir="-1" aria-label="Decrease SPFLEX">&#9660;</button></div></div><input id="rosterSPFLEX" type="hidden" data-min="0" data-max="5" value="0"></label>
                    <label class="roster-stepper" data-roster-key="K"><span>K</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterKValue">1</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="K" data-step-dir="1" aria-label="Increase K">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="K" data-step-dir="-1" aria-label="Decrease K">&#9660;</button></div></div><input id="rosterK" type="hidden" data-min="0" data-max="5" value="1"></label>
                    <label class="roster-stepper" data-roster-key="DEF"><span>DEF</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterDEFValue">1</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="DEF" data-step-dir="1" aria-label="Increase DEF">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="DEF" data-step-dir="-1" aria-label="Decrease DEF">&#9660;</button></div></div><input id="rosterDEF" type="hidden" data-min="0" data-max="5" value="1"></label>
                    <label class="roster-stepper" data-roster-key="BN"><span>BN</span><div class="roster-stepper-controls"><span class="roster-stepper-value" id="rosterBNValue">5</span><div class="roster-stepper-arrows"><button type="button" class="roster-stepper-btn" data-roster-step="BN" data-step-dir="1" aria-label="Increase BN">&#9650;</button><button type="button" class="roster-stepper-btn" data-roster-step="BN" data-step-dir="-1" aria-label="Decrease BN">&#9660;</button></div></div><input id="rosterBN" type="hidden" data-min="0" data-max="13" value="5"></label>
                  </div>
                  <div class="capacity-controls">
                    <label for="roundTimerMinutes" class="type-display">Round Timer:</label>
                    <select id="roundTimerMinutes" class="type-btn" aria-label="Select round timer minutes">
                      <option value="3">3 minutes</option>
                      <option value="4">4 minutes</option>
                      <option value="5">5 minutes</option>
                      <option value="6">6 minutes</option>
                      <option value="7">7 minutes</option>
                      <option value="8">8 minutes</option>
                      <option value="9">9 minutes</option>
                      <option value="10">10 minutes</option>
                    </select>
                  </div>
                  <div class="capacity-controls">
                    <label for="ajDraftMode" class="type-display">A-J:</label>
                    <input id="ajDraftMode" type="checkbox" aria-label="Toggle A-J round balancing mode">
                  </div>
                  <div class="capacity-controls">
                    <label for="waiverMode" class="type-display">Waivers:</label>
                    <select id="waiverMode" class="type-btn" aria-label="Select waiver mode">
                      <option value="off">Off</option>
                      <option value="random">Random</option>
                      <option value="skill">Skill</option>
                    </select>
                  </div>
                  <button id="applyRosterBtn" type="button" class="type-btn">Save Changes</button>
                </div>
                <div id="rosterSummary" class="roster-summary"></div>
                <div class="lobby-controls custom-budgets-controls" id="customBudgetControls">
                  <button id="toggleBudgetPanelBtn" type="button" class="type-btn">Custom Budgets</button>
                </div>
                <div id="customBudgetPanel" class="custom-budget-panel hidden">
                  <div id="customBudgetList" class="custom-budget-list"></div>
                  <div class="custom-budget-actions">
                    <button id="applyCustomBudgetsBtn" type="button" class="type-btn">Apply Budgets</button>
                    <button id="resetCustomBudgetsBtn" type="button" class="type-btn">Reset to 200</button>
                  </div>
                </div>
              </div>
            </details>
            <div class="lobby-action-row">
              <button id="startDraftBtn" class="btn btn-signup">Start Draft</button>
              <button id="leaveBtn" class="btn">Leave Draft</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script>
    // Try to load socket.io from the server; if that 404s, fall back to CDN
    (function(){
      var s = document.createElement('script');
      s.src = '/socket.io/socket.io.js';
      s.onload = function(){ console.debug('Loaded socket.io from server'); };
      s.onerror = function(){
        console.warn('Local socket.io not available, falling back to CDN');
        var c = document.createElement('script');
        c.src = 'https://cdn.socket.io/4.7.2/socket.io.min.js';
        c.onload = function(){ console.debug('Loaded socket.io from CDN'); };
        document.head.appendChild(c);
      };
      document.head.appendChild(s);
    })();
  </script>
  <script src="preferences.js"></script>
  <script src="lobby.js?v=20260616a"></script>
</body>
</html>
